[project]
name = "marketing-ai"
version = "1.0.0"
description = "AI-powered marketing content generation SaaS platform"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # pyflakes, pycodestyle, isort, pyupgrade
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --asyncio-mode=auto"
testpaths = ["tests"]
